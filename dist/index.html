<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <meta name="description" content="自习站：把学习计划、专注计时、复习卡片与知识笔记放在一起。数据保存在你的浏览器。">
  <title>自习站 · 把今天学扎实</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#today" aria-label="自习站首页"><span class="brand-mark">自</span><span>自习站<small>STUDY STATION</small></span></a>
      <div class="sidebar-label">你的学习空间</div>
      <nav id="navigation">
        <a href="#today" data-view="today" aria-label="今日计划"><span data-icon="sun"></span><span>今日计划</span></a>
        <a href="#cards" data-view="cards" aria-label="复习卡片"><span data-icon="cards"></span><span>复习卡片</span><span class="nav-badge" id="due-badge">0</span></a>
        <a href="#notes" data-view="notes" aria-label="知识笔记"><span data-icon="book"></span><span>知识笔记</span></a>
        <a href="#records" data-view="records" aria-label="学习记录"><span data-icon="chart"></span><span>学习记录</span></a>
      </nav>
      <div class="sidebar-bottom"><div class="little-art" aria-hidden="true"><span></span><i></i><b></b></div><p>一小步，<br>也在向前。</p><small>留一点耐心，给正在努力的自己。</small><button class="text-button" id="settings-button"><span data-icon="settings"></span>偏好与备份</button></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">我的工作台 <span>/</span> <strong id="view-name">今日计划</strong></div><div class="top-actions"><span class="local-status" id="save-status"><i></i>本地已保存</span><button class="icon-button" id="quick-settings" aria-label="打开偏好与备份"><span data-icon="settings"></span></button></div></header>
      <main id="main" tabindex="-1"></main>
      <footer class="page-footer"><span>自习站 · 学习有迹可循</span><span>数据仅保存在当前浏览器，请定期备份。</span></footer>
    </div>
  </div>
  <dialog id="editor-dialog" class="editor-dialog" aria-labelledby="dialog-title"><div id="editor-content"></div></dialog>
  <dialog id="focus-dialog" class="focus-dialog" aria-labelledby="focus-title"><button class="icon-button focus-close" id="exit-focus" aria-label="退出沉浸模式"><span data-icon="close"></span></button><span class="eyebrow">ONE THING AT A TIME</span><h2 id="focus-title">现在，只做这一件事。</h2><p id="focus-task"></p><div class="focus-time" id="focus-time">25:00</div><div class="focus-controls"><button class="primary" id="focus-toggle">开始专注</button><button class="button" id="focus-reset">重置</button></div><small>退出沉浸模式后，计时仍会继续。</small></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <script type="module" src="app.mjs"></script>
</body>
</html>
